name: Build Storm Ray

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download Forge / Minecraft dependencies
        run: ./gradlew --no-daemon dependencies --configuration compileClasspath > /dev/null

      - name: Compile
        run: ./gradlew --no-daemon --stacktrace compileJava

      - name: Run tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Build mod JAR
        run: ./gradlew --no-daemon --stacktrace build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: storm-ray-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
